<!-- Definição da macro do botão principal -->
{% macro botao_primario(texto, tipo_submissao, id_botao) %}
<button type="{{ tipo_submissao }}" {% if let Some(id)=id_botao %} id="{{ id }}" {% endif %}
    class="text-white bg-purple-600 hover:bg-purple-700 focus:ring-2 focus:ring-blue-300 font-medium rounded-lg text-sm py-2.5 px-5 w-full sm:w-auto">
    {{ texto }}
</button>
{% endmacro %}
