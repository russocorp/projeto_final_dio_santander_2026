<!-- Definição da macro do botão principal -->
{% macro botao_primario(texto, tipo_submissao, id_botao) %}
  <button type="{{ tipo_submissao }}"
          {% if let Some(id) = id_botao %} id="{{ id }}" {% endif %}
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl transition shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 cursor-pointer">
    {{ texto }}
  </button>
{% endmacro %}

<!-- Definição de um botão secundário (ex: para cancelar ou voltar) -->
{% macro botao_secundario(texto, url_clique) %}
  <a href="{{ url_clique }}"
     class="w-full block text-center bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2.5 rounded-xl transition border border-gray-300 focus:outline-none">
    {{ texto }}
  </a>
{% endmacro %}
